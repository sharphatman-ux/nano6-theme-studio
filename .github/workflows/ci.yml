name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests (no firmware; firmware tests are skipped)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
        run: |
          # setup-python prepends its own lib dir; that shadows the system
          # libstdc++/GL bits Qt's offscreen plugin loads and aborts (exit 134).
          unset LD_LIBRARY_PATH
          python -m pytest -q -rs
