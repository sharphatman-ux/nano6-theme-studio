line-length = 100
target-version = "py311"
extend-exclude = ["tests/upstream", "vendor", "third_party", "dist", "build"]

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP007", "E741", "B905"]

[lint.per-file-ignores]
"tests/*" = ["E402", "F841", "B007"]
"scripts/*" = ["E402", "E731", "B007"]
